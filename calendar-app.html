<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMyMzI2MkEiLz48cmVjdCB4PSIxMyIgeT0iMTIiIHdpZHRoPSIzOCIgaGVpZ2h0PSI0MCIgcng9IjYiIGZpbGw9IiNGN0Y3RjQiLz48bGluZSB4MT0iOSIgeTE9IjM0IiB4Mj0iNTUiIHkyPSIzNCIgc3Ryb2tlPSIjQjQ0NzJGIiBzdHJva2Utd2lkdGg9IjYiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjM0IiByPSI2IiBmaWxsPSIjQjQ0NzJGIi8+PC9zdmc+">
<title>カレンダー予定消化ツール</title>
<style>
  :root{
    --paper:#F7F7F4;
    --grid:#E4E6E0;
    --grid-strong:#D2D5CD;
    --ink:#23262A;
    --ink-soft:#6B7078;
    --ink-faint:#9AA0A6;
    --shu:#B4472F;
    --shu-deep:#8E3722;
    --gray:#9AA0A6;               /* 済(灰色) の表示色 */
    --gothic:"BIZ UDPGothic","Meiryo","Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
    --mincho:"BIZ UDPGothic","Meiryo","Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);font-family:var(--gothic);font-size:14px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 120px}

  /* ---- header ---- */
  header{border-bottom:1.5px solid var(--ink);padding-bottom:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 6px}
  h1{font-family:var(--mincho);font-weight:600;font-size:27px;letter-spacing:.06em;margin:0 0 4px}
  .sub{color:var(--ink-soft);font-size:13px;margin:0}

  /* ---- top controls ---- */
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:20px 0 18px}
  .btn{
    font-family:var(--gothic);font-size:13px;letter-spacing:.02em;
    background:transparent;border:1px solid var(--ink);color:var(--ink);
    padding:8px 16px;cursor:pointer;transition:background .12s,color .12s;
    display:inline-block;text-decoration:none;text-align:center
  }
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
  .btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
  .btn.primary:hover{background:var(--shu-deep);border-color:var(--shu-deep)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:disabled:hover{background:transparent;color:var(--ink)}

  .nav{display:inline-flex;border:1px solid var(--ink)}
  .nav button{
    font-family:var(--mono);font-size:13px;background:transparent;border:none;
    border-right:1px solid var(--ink);padding:7px 13px;cursor:pointer;color:var(--ink)
  }
  .nav button:last-child{border-right:none}
  .nav button:hover{background:var(--ink);color:var(--paper)}

  .toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--ink);width:15px;height:15px;cursor:pointer}

  .status{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 8px}
  .status.live .dot{background:#3f7a4f}
  .status.mock .dot{background:var(--shu)}

  /* ---- calendar filter chips ---- */
  .cals{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .calchip{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;
    border:1px solid var(--grid-strong);background:#fff;padding:5px 11px;cursor:pointer;
    color:var(--ink);user-select:none;transition:opacity .12s
  }
  .calchip .sw{width:10px;height:10px;border-radius:2px;flex:0 0 10px}
  .calchip.off{opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}

  /* ---- lane grid ---- */
  .weekblock{margin-bottom:30px}
  .weeklabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
    border-bottom:1px solid var(--grid-strong);padding-bottom:5px;margin:0 0 0}
  .lanescroll{overflow-x:auto}
  .lanegrid{display:grid;grid-template-columns:92px repeat(7,minmax(104px,1fr));min-width:800px}
  .corner{border-bottom:1px solid var(--grid-strong)}
  .dayhead{padding:7px 6px 6px;border-bottom:1px solid var(--grid-strong);border-left:1px solid var(--grid);text-align:center}
  .dayhead .dnum{font-family:var(--mono);font-size:16px;line-height:1.2;display:block}
  .dayhead .dwk{font-size:10.5px;color:var(--ink-soft);letter-spacing:.08em}
  .dayhead.sat .dwk,.dayhead.sat .dnum{color:#3F5A73}
  .dayhead.sun .dwk,.dayhead.sun .dnum{color:var(--shu)}
  .dayhead.today{background:var(--ink)}
  .dayhead.today .dnum,.dayhead.today .dwk{color:var(--paper)}
  .lanename{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 8px 8px 0;
    border-bottom:1px solid var(--grid);justify-content:flex-end;text-align:right;color:var(--ink-soft)}
  .swatch{width:3px;align-self:stretch;flex:0 0 3px}
  .cell{border-left:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:4px;min-height:48px;display:flex;flex-direction:column;gap:3px}
  .cell.todaycol{background:rgba(255,255,255,.6)}

  .chip{
    position:relative;font-size:10.5px;line-height:1.35;padding:3px 6px 3px 6px;
    border-left:2.5px solid var(--ink);background:#fff;color:var(--ink);
    word-break:break-word;cursor:pointer;text-align:left;width:100%;
    font-family:inherit;display:block
  }
  .chip:hover{box-shadow:1px 1px 0 var(--grid-strong)}
  .chip:focus-visible{outline:2px solid var(--shu);outline-offset:1px}
  .chip .t{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);display:block}
  .chip.routine{opacity:.55;border-left-style:dotted}
  .chip.allday{border-left:none;border-top:2.5px solid var(--ink)}
  .chip.done{border-left-color:var(--gray)!important;background:#F1F1EE;color:var(--ink-faint)}
  .chip.done .ttl{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--gray)}
  .chip.done .seal{opacity:1}
  .chip .seal{
    position:absolute;top:2px;right:3px;font-family:var(--mincho);font-size:11px;
    color:var(--shu);opacity:0;font-weight:600;
    border:1.2px solid var(--shu);border-radius:50%;width:15px;height:15px;
    display:flex;align-items:center;justify-content:center;line-height:1
  }

  /* ---- 上部の一言スペース（固定表示・白い枠） ---- */
  .banner{position:sticky;top:0;z-index:15;max-width:640px;margin:0 0 6px;padding:6px 0;background:var(--paper)}
  :root[data-mode="matrix"] .banner{position:static;z-index:auto}   /* マトリクスはバナーを固定しない */
  .banner-toggle{display:inline-flex;align-items:center;gap:6px;margin:0 0 5px 1px;
    font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none}
  .banner-toggle input{width:15px;height:15px;cursor:pointer;accent-color:var(--shu)}
  .bannertext{
    display:block;width:100%;box-sizing:border-box;
    font-family:var(--gothic);font-size:14px;line-height:1.7;color:var(--ink);
    background:#fff;border:1px solid var(--grid-strong);border-radius:3px;
    padding:9px 13px;outline:none;resize:none;overflow:hidden;
    white-space:pre-wrap;word-break:break-word;
    box-shadow:0 1px 4px -2px rgba(0,0,0,.28)
  }
  .bannertext:focus{border-color:var(--ink)}
  .bannertext::placeholder{color:var(--ink-faint)}

  /* ---- mode switch ---- */
  .modes{display:inline-flex;border:1px solid var(--ink)}
  .modes button{font-family:var(--gothic);font-size:13px;background:transparent;border:none;
    border-right:1px solid var(--ink);padding:8px 15px;cursor:pointer;color:var(--ink);transition:background .12s}
  .modes button:last-child{border-right:none}
  .modes button:hover{background:var(--ink);color:var(--paper)}
  .modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .modes button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

  /* ---- timeline (24h grid, stacked days) ---- */
  .scrollwrap{max-width:640px}   /* 一枚ものは横に間延びさせず、読みやすい幅に収める */
  .tl-day{border-top:1px solid var(--grid-strong);padding-top:10px;margin-bottom:10px}
  .tl-daylabel{display:flex;align-items:center;gap:9px;font-family:var(--mono);margin:0 0 8px;padding-left:2px}
  .tl-daylabel .dn{font-size:19px;line-height:1}
  .tl-daylabel .dw{font-size:12px;color:var(--ink-soft)}
  .tl-daylabel.sun .dn,.tl-daylabel.sun .dw{color:var(--shu)}
  .tl-daylabel.sat .dn,.tl-daylabel.sat .dw{color:#3F5A73}
  .tl-daylabel.today .dn{background:var(--shu);color:#fff;border-radius:999px;padding:2px 9px}
  /* 日ヘッダー（日付＋終日）を、その日を見ている間ずっと上に貼り付ける（sticky） */
  .tl-dayhead{position:sticky;top:var(--bannerH,0);z-index:12;background:var(--paper);
    border-bottom:1px solid var(--grid-strong);padding-bottom:6px}
  /* 終日ゾーン：左「終日」ラベル＋横いっぱいのバー */
  .tl-allday{margin:0 0 2px 56px;padding:2px 0 0;display:flex;flex-direction:column;gap:3px}
  .tl-adlabel{position:absolute;left:-54px;top:3px;width:48px;text-align:right;
    font-family:var(--mono);font-size:10px;color:var(--ink-faint);background:var(--paper)}
  .ad{
    display:block;width:100%;box-sizing:border-box;
    font-size:11px;line-height:1.35;padding:4px 9px;background:#fff;color:var(--ink);
    border-left:4px solid var(--ink);border-radius:2px;cursor:pointer;
    font-family:inherit;text-align:left
  }
  .ad.routine{border-left-style:dotted}
  .ad.done{border-left-color:var(--gray)!important;background:#F1F1EE!important;color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--gray)}
  .tl-grid{position:relative;margin-left:56px;border-left:1px solid var(--grid-strong)}
  .tl-hour{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
  .tl-hour.h6,.tl-hour.h12,.tl-hour.h18{border-top-color:var(--grid-strong)}
  .tl-hour span{position:absolute;left:-54px;top:-7px;width:48px;text-align:right;
    font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .tl-ev{
    position:absolute;overflow:hidden;border-left:5px solid var(--ink);background:#fff;
    font-size:12px;line-height:1.28;padding:2px 8px;cursor:pointer;border-radius:3px;
    box-shadow:0 1px 2px -1px rgba(0,0,0,.25);text-align:left;font-family:inherit;color:var(--ink)
  }
  .tl-ev:hover{z-index:6;box-shadow:0 2px 7px -1px rgba(0,0,0,.3)}
  .tl-ev:focus-visible{outline:2px solid var(--shu);outline-offset:1px;z-index:6}
  .tl-ev .t{font-family:var(--mono);font-size:10px;color:var(--ink-soft);display:block}
  .tl-ev .ttl{font-weight:500}
  /* 背の低い予定は時刻＋題名を1行にまとめて、切れないようにする */
  .tl-ev.short{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
  .tl-ev.short .t{display:inline;flex:0 0 auto}
  .tl-ev.short .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .tl-ev.routine{border-left-style:dotted}   /* ルーティンは点線枠で区別（opacityは使わない＝文字が曇らない） */
  .tl-ev.done{border-left-color:var(--gray)!important;background:#F1F1EE!important;color:var(--ink-faint)}
  .tl-ev.done .ttl{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--gray)}
  .tl-ev.done::after{content:"済";position:absolute;top:1px;right:3px;font-family:var(--mincho);
    font-size:10px;color:var(--shu);font-weight:600}
  /* 浮動ボタン（左下に縦積み：上=先頭へ / 下=現在時刻へ） */
  .fabs{position:fixed;right:16px;left:auto;bottom:20px;z-index:30;display:none;flex-direction:column;gap:10px}
  .fabs.show{display:flex}
  .fab{
    width:52px;height:52px;border-radius:50%;cursor:pointer;
    font-family:var(--gothic);font-size:15px;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:center;gap:4px;
    box-shadow:0 4px 14px -3px rgba(0,0,0,.5)
  }
  .fab:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
  .nowbtn{background:var(--ink);color:var(--paper);border:none}
  .nowbtn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--shu)}
  .nowbtn:hover{background:var(--shu)}
  .nowbtn:hover::before{background:var(--paper)}
  .topbtn{background:var(--paper);color:var(--ink);border:1px solid var(--ink);font-size:20px;line-height:1}
  .topbtn:hover{background:var(--ink);color:var(--paper)}

  /* ---- ドラッグで新規作成する時の選択ボックス ---- */
  .tl-creating{position:absolute;left:1px;right:1px;z-index:8;pointer-events:none;
    background:color-mix(in srgb,var(--shu) 20%,#fff);border:1px dashed var(--shu);border-radius:3px;
    font-family:var(--mono);font-size:10px;color:var(--shu-deep);padding:1px 5px;overflow:hidden}
  /* 編集できる予定：つかむと動かせる／下端で長さ変更 */
  .tl-ev.canmove{cursor:grab}
  .tl-ev.editing{z-index:22;box-shadow:0 4px 12px -2px rgba(0,0,0,.45)}
  .tl-ev .grip{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
  .tl-ev .grip::after{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:20px;height:2px;border-radius:2px;background:currentColor;opacity:.4}
  .tl-now{position:absolute;left:0;right:0;height:2px;background:var(--shu);z-index:7;pointer-events:none}
  .tl-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--shu)}
  /* 赤線に添える日付ラベル（時刻の目盛りのあたりに赤文字2段） */
  .tl-nowlab{
    position:absolute;transform:translateY(-50%);z-index:9;pointer-events:none;
    font-family:var(--mono);font-size:10px;line-height:1.2;font-weight:600;
    color:var(--shu);text-align:center;
    background:#fff;border:1px solid var(--shu);border-radius:3px;padding:1px 2px   /* 白背景で前面。裏の「◯時」を隠してよい */
  }
  .tl-grid > .tl-nowlab{left:-58px;width:50px}      /* スクロール：時刻の目盛り位置 */
  .d3gutter > .tl-nowlab{right:2px}                  /* 3日：左の時刻ガター */

  /* ---- 3-day view (3 columns, shared time axis) ---- */
  .d3{--gut:52px}
  .d3head,.d3adrow,.d3body{display:grid;grid-template-columns:var(--gut) repeat(3,minmax(0,1fr))}
  .d3head{position:sticky;top:var(--bannerH,0);z-index:8;background:var(--paper);border-bottom:1px solid var(--grid-strong)}
  .d3dh{padding:6px 4px 5px;text-align:center;border-left:1px solid var(--grid);font-family:var(--mono)}
  .d3dh .d3dn{font-size:18px;line-height:1.1;display:block}
  .d3dh .d3dw{font-size:11px;color:var(--ink-soft)}
  .d3dh.sun .d3dn,.d3dh.sun .d3dw{color:var(--shu)}
  .d3dh.sat .d3dn,.d3dh.sat .d3dw{color:#3F5A73}
  .d3dh.today{background:var(--ink)}
  .d3dh.today .d3dn,.d3dh.today .d3dw{color:var(--paper)}
  .d3adrow{border-bottom:1px solid var(--grid-strong)}
  .d3adlabel{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:right;padding:6px 6px 0;align-self:start}
  .d3adcell{border-left:1px solid var(--grid);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:22px}
  .d3gutter{position:relative}
  .d3hr{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .d3col{position:relative;border-left:1px solid var(--grid)}
  .d3col.today{background:rgba(255,255,255,.55)}
  .d3line{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
  .d3line.h6,.d3line.h12,.d3line.h18{border-top-color:var(--grid-strong)}

  /* ---- タスク（タグ別グループ俯瞰） ---- */
  .tasks{max-width:640px}
  .tk-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;
    padding:9px 10px;border:1px solid var(--grid-strong);border-radius:5px;background:#fff}
  .tk-add select,.tk-add input{font-family:var(--gothic);font-size:12.5px;padding:6px 8px;
    border:1px solid var(--grid-strong);border-radius:3px;background:#fff;color:var(--ink)}
  .tk-add #tkAddTitle{flex:1;min-width:120px;font-size:13px}
  .tk-add .btn{padding:6px 12px;font-size:12.5px}
  .tk-add [disabled]{opacity:.5}
  .tk-total{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:0 0 12px}
  .tk-group{margin:0 0 18px}
  .tk-tag{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;padding:0 0 5px;
    border-bottom:1.5px solid var(--ink);font-family:var(--gothic);font-weight:600;font-size:14px}
  .tk-tag .tk-count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:400}
  .tk-item{display:flex;align-items:center;gap:9px;padding:6px 4px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:3px}
  .tk-item:hover{background:rgba(0,0,0,.03)}
  .tk-item.tk-sub{padding-left:22px}
  .tk-check{flex:0 0 auto;width:16px;height:16px;border:1.5px solid var(--ink-soft);border-radius:50%;cursor:pointer}
  .tk-check:hover{border-color:var(--shu);background:radial-gradient(circle,var(--shu) 40%,transparent 42%)}

  /* タスク編集パネル */
  .tkedit-bd{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.25);display:none}
  .tkedit-bd.on{display:block}
  .tkedit{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
    width:300px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--ink);border-radius:8px;
    box-shadow:0 14px 40px -10px rgba(0,0,0,.5);padding:16px;display:none}
  .tkedit.on{display:block}
  .tke-l{display:block;font-size:11px;color:var(--ink-soft);margin:0 0 3px}
  .tke-in{width:100%;box-sizing:border-box;font-family:var(--gothic);font-size:13px;padding:7px 9px;
    border:1px solid var(--grid-strong);border-radius:4px;margin:0 0 10px;background:#fff;color:var(--ink)}
  .tke-row{display:flex;gap:10px}
  .tke-row span{flex:1;min-width:0}
  .tke-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
  .tke-actions .btn{padding:6px 12px;font-size:12.5px}
  .tke-sched{margin:2px 0 10px;padding:9px 10px;border:1px dashed var(--grid-strong);border-radius:5px;background:rgba(0,0,0,.015)}
  .tke-schl{font-size:11px;color:var(--ink-soft);margin:0 0 7px}
  .tke-schl #tkSchedCur{color:var(--shu)}
  .tke-sched-actions{display:flex;gap:7px;margin-top:2px}
  .tke-sched-actions .btn{padding:6px 12px;font-size:12.5px}
  .tk-sch{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--shu)}
  .mx-card .mx-sch{flex:0 0 auto;font-size:10px}
  .mx-card.sched{box-shadow:0 1px 3px -1px rgba(0,0,0,.3),0 0 0 1.5px var(--shu)}

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
"use strict";

/* ============================================================
   設定 — 実データに繋ぐには CLIENT_ID を入れる
   （Google Cloud Console で作った「OAuth 2.0 クライアント ID(ウェブ)」）
   空のあいだはモックデータで動きます。
   ============================================================ */
const CONFIG = {
  CLIENT_ID: "162155904085-ud13pisfjodgim2t19q9n2us70ekc9n4.apps.googleusercontent.com",
  SCOPE: "https://www.googleapis.com/auth/calendar",
  GRAY_COLOR_ID: "8",                              // Google の「Graphite(灰)」
  WEEKS_SHOWN: 2,
  MAX_EVENTS: 2500
};
const BUILD = "b44";  // 画面に表示する版。キャッシュか実挙動かの切り分け用

/* ============================================================
   状態
   ============================================================ */
let TOKEN = null;                 // アクセストークン(実データ時)
let LIVE = false;                 // 実データに接続済みか
let tokenClient = null;
let calendars = [];               // [{id, name, color, off}]
let events = [];                  // 正規化済みイベント
let anchor = new Date();                // 表示の基準日（既定は今日）
let showDone = false;                   // 済は既定で非表示。チェックで表示する
let matrixPos = {};                     // マトリクス配置 eventId -> {x,y}(0..1)
try{ matrixPos = JSON.parse(localStorage.getItem("cal_matrixpos")||"{}") || {}; }catch(e){}
let matrixCals = null;                   // (旧) 未使用
try{ const a=JSON.parse(localStorage.getItem("cal_matrixcals")||"null"); if(Array.isArray(a)) matrixCals=new Set(a); }catch(e){}
let matrixTags = null;                    // マトリクスに載せるタグ(Tasksリスト)ID(Set)。null=全タグ
try{ const a=JSON.parse(localStorage.getItem("cal_matrixtags")||"null"); if(Array.isArray(a)) matrixTags=new Set(a); }catch(e){}
let taskSched = {};                        // タスク⇔カレンダー予定の紐づけ taskId->{calId,eventId,date,time,end}
try{ taskSched = JSON.parse(localStorage.getItem("cal_tasksched")||"{}") || {}; }catch(e){}
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Tokyo";
let mode = "scroll";                    // "scroll"(一枚もの) | "day3"(3日)
let pendingScrollNow = false;           // 次の描画後に現在時刻へ自動スクロールするか
const PXH = 60;                         // 時間軸: 1時間の高さ(px)
const MINEV_H = 22;                     // 予定ブロックの最小の高さ(px)。これ未満は潰さない

/* ============================================================
   日付ユーティリティ（JST基準の "YYYY-MM-DD"）
   ============================================================ */
const WK = ["日","月","火","水","木","金","土"];
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const g = (x.getDay()+6)%7;            // 月=0 … 日=6
  x.setDate(x.getDate()-g);
  return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function md(s){ const [,m,dd]=s.split("-"); return (+m)+"/"+(+dd); }
function wdOf(s){ return parseYmd(s).getDay(); }
let TODAY = ymd(new Date());   // 日付をまたいだら tickNow() が更新する

/* 表示する日付の並び（モード別） */
function daysToShow(){
  if(mode==="day3") return [0,1,2].map(i=>ymd(addDays(anchor,i)));
  if(mode==="matrix"){ const s=mondayOf(anchor); return Array.from({length:7}, (_,i)=>ymd(addDays(s,i))); }
  const start = mondayOf(anchor);                    // スクロールは週頭から
  return Array.from({length:7*CONFIG.WEEKS_SHOWN}, (_,i)=>ymd(addDays(start,i)));
}
/* データ取得範囲（両モードを覆う広め） */
function fetchRange(){
  const start = mondayOf(anchor);
  const timeMin = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 0,0,0,0);
  const timeMax = addDays(start, 7*CONFIG.WEEKS_SHOWN);
  return { timeMin, timeMax };
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   モックデータ（サンプルの実データを流用）
   ============================================================ */
function mockCalendars(){
  return [
    {id:"mock-shigoto", name:"仕事",         color:"#3F5A73", off:false},
    {id:"mock-horenso", name:"報連相",       color:"#6B5B7B", off:false},
    {id:"mock-private", name:"プライベート", color:"#5E7A5E", off:false}
  ];
}
function mockEvents(){
  // 今日を含む週の月曜を起点に、サンプルと同じ「かたち」を再現する
  const base = mondayOf(new Date());
  const D = n => ymd(addDays(base, n));            // n=0..13
  const ev = [];
  let seq = 0;
  const push = o => ev.push(Object.assign({
    id:"m"+(++seq), calId:o.calId, title:o.title, allDay:!!o.allDay,
    time:o.time||"", end:o.end||"", routine:!!o.routine, done:false, doneAt:""
  }, {}, o.date?{date:o.date}:{}));
  const workdays = [0,1,2,3,4,7,8,9,10,11];        // 月〜金 × 2週
  workdays.forEach(n=>{
    push({calId:"mock-shigoto", date:D(n), time:"08:00", end:"08:30", title:"出勤打刻", routine:true});
    push({calId:"mock-shigoto", date:D(n), time:"18:00", end:"18:30", title:"退勤打刻", routine:true});
  });
  push({calId:"mock-shigoto", date:D(4),  time:"09:00", title:"ﾙｰﾃｨﾝ表確認_来週の予定", routine:true});
  push({calId:"mock-shigoto", date:D(11), time:"09:00", title:"ﾙｰﾃｨﾝ表確認_来週の予定", routine:true});
  push({calId:"mock-shigoto", date:D(5),  allDay:true, title:"はまぎん(持株会)前月入出金の確認", routine:true});
  push({calId:"mock-shigoto", date:D(12), time:"10:00", end:"19:45", title:"（MEK社内コンペ）", routine:false});

  push({calId:"mock-horenso", date:D(4),  time:"12:00", title:"斎藤B_週報提出", routine:true});
  push({calId:"mock-horenso", date:D(11), time:"12:00", title:"斎藤B_週報提出", routine:true});
  push({calId:"mock-horenso", date:D(5),  allDay:true, title:"ちばぎん流山の前月末残高を高橋さんにトス", routine:true});
  push({calId:"mock-horenso", date:D(5),  allDay:true, title:"各位_〇月度MEKグループ損益速報エクセル", routine:true});

  [1,3,5,7,9,11].forEach(n=> push({calId:"mock-private", date:D(n), time:"07:45", end:"08:00", title:"TOEIC対策", routine:true}));
  [0,2,4,6,8,10].forEach(n=> push({calId:"mock-private", date:D(n), time:"07:45", end:"08:00", title:"CIA対策", routine:true}));
  push({calId:"mock-private", date:D(6), time:"05:30", end:"17:00", title:"勝沼G_0530OUT_須藤P橋川P", routine:false});
  return ev;
}

/* ============================================================
   描画
   ============================================================ */
const viewEl = document.getElementById("view");

function calById(id){ return calendars.find(c=>c.id===id); }

function visibleEvents(){
  const onCals = new Set(calendars.filter(c=>!c.off).map(c=>c.id));
  return events.filter(e=>{
    if(!onCals.has(e.calId)) return false;
    if(!showDone && e.done) return false;   // 済は既定で隠す（チェック時のみ表示）
    return true;
  });
}

function cmp(a,b){
  const ka = (a.date)+(a.allDay?"00:00":(a.time||"00:00"));
  const kb = (b.date)+(b.allDay?"00:00":(b.time||"00:00"));
  return ka.localeCompare(kb);
}

function renderCals(){
  const el = document.getElementById("cals");
  el.innerHTML = calendars.map(c=>
    `<span class="calchip${c.off?" off":""}" data-cal="${esc(c.id)}">
       <span class="sw" style="background:${c.color}"></span>${esc(c.name)}</span>`).join("");
  el.querySelectorAll(".calchip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      const c = calById(ch.dataset.cal); c.off = !c.off; renderCals(); renderView();
    });
  });
}

/* ---- タスク：タグ（リスト）別のグループ俯瞰（読むだけ・第1版） ---- */
function mdFromDue(due){ const [,m,d] = due.slice(0,10).split("-"); return (+m)+"/"+(+d); }
function renderTasks(){
  if(!LIVE) return `<p class="empty-note">Googleに接続するとタスクが表示されます。</p>`;
  if(taskData === null){ loadTasks(); return `<p class="empty-note">タスクを読み込み中…</p>`; }
  const has = taskData.length > 0, dis = has ? "" : " disabled";
  const opts = taskData.map(g=>`<option value="${esc(g.list.id)}">${esc(g.list.title)}</option>`).join("");
  const addBar = `<div class="tk-add">
    <select id="tkAddList"${dis}>${opts || `<option>（タグ未作成）</option>`}</select>
    <input id="tkAddTitle" placeholder="タスクを追加…"${dis}>
    <input id="tkAddDue" type="date" title="期日（任意）"${dis}>
    <button id="tkAddBtn" class="btn primary"${dis}>＋タスク</button>
    <button id="tkNewList" class="btn">＋新しいタグ</button>
  </div>`;
  if(!has) return `<div class="tasks">${addBar}<p class="empty-note">タグ（リスト）がまだありません。「＋新しいタグ」で作れます。</p></div>`;
  const total = taskData.reduce((n,g)=>n+g.tasks.length, 0);
  return `<div class="tasks">${addBar}<p class="tk-total">未完了 ${total}件 / ${taskData.length}タグ</p>`
    + taskData.map(g=>{
        const items = g.tasks.length ? g.tasks.map(t=>{
          const sub = t.parent ? " tk-sub" : "";
          const sch = taskSched[t.id] ? `<span class="tk-sch" title="予定 ${esc(taskSched[t.id].date)} ${esc(taskSched[t.id].time)}">📅 ${mdFromDue(taskSched[t.id].date)} ${esc(taskSched[t.id].time)}</span>` : "";
          return `<div class="tk-item${sub}" data-id="${esc(t.id)}" data-list="${esc(g.list.id)}">
            <span class="tk-check" title="完了にする"></span>
            <span class="tk-ttl">${esc(t.title||"(無題)")}</span>
            ${sch}
            ${t.due ? `<span class="tk-due">${mdFromDue(t.due)}</span>` : ""}
          </div>`;
        }).join("") : `<div class="tk-none">（なし）</div>`;
        return `<section class="tk-group">
          <h3 class="tk-tag"><span class="tk-tagname">${esc(g.list.title)}</span><span class="tk-count">${g.tasks.length}</span></h3>
          ${items}
        </section>`;
      }).join("")
    + `</div>`;
}

function tkWire(){
  const add = document.getElementById("tkAddBtn");
  if(add) add.addEventListener("click", addTask);
  const nl = document.getElementById("tkNewList");
  if(nl) nl.addEventListener("click", addTagList);

  document.querySelectorAll(".tk-item").forEach(item=>{
    const listId = item.dataset.list, id = item.dataset.id;
    const chk = item.querySelector(".tk-check");
    if(chk) chk.addEventListener("click", e=>{ e.stopPropagation(); completeTask(listId, id); });
    item.addEventListener("click", ()=> openTaskEdit(listId, id));
  });

async function completeTask(listId, id){
  try{
    await apiTasks("/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(id),
      { method:"PATCH", body: JSON.stringify({ status:"completed" }) });
    const g = taskData.find(x=>x.list.id===listId); if(g) g.tasks = g.tasks.filter(t=>t.id!==id);
    let ch=false;
    if(matrixPos[id]){ delete matrixPos[id]; ch=true; }             // マトリクスからも外す
    if(taskSched[id]){ await dropLinkedEvent(id); ch=true; }        // 紐づく予定も消す
    if(ch) saveSettingsDesc();
    renderView(); toast("完了にしました");
  }catch(err){ toast("完了に失敗: "+(err.message||err)); }
}
let tkEditRef = null;
function openTaskEdit(listId, id){
  const g = taskData.find(x=>x.list.id===listId); if(!g) return;
  const t = g.tasks.find(x=>x.id===id); if(!t) return;
  tkEditRef = { listId, taskId:id };
  document.getElementById("tkEditTitle").value = t.title || "";
  document.getElementById("tkEditDue").value = t.due ? t.due.slice(0,10) : "";

  // スケジュール欄
  const sched = taskSched[id];
  document.getElementById("tkSchedDate").value = sched ? sched.date : "";
  document.getElementById("tkSchedTime").value = sched ? sched.time : "";

    (wcals.length ? wcals : [{id:"primary",name:"メイン"}]).map(c=>
      `<option value="${esc(c.id)}"${sched&&sched.calId===c.id?" selected":""}>${esc(c.name)}</option>`).join("");
  document.getElementById("tkSchedCur").textContent = sched ? "（現在: "+mdFromDue(sched.date)+" "+sched.time+"–"+sched.end+"）" : "";

}
/* タスク → カレンダー予定を作成/更新（紐づけ・タスクは残る） */
async function scheduleTask(){
  if(!tkEditRef) return;
  const id = tkEditRef.taskId;
  const date = document.getElementById("tkSchedDate").value;
  const time = document.getElementById("tkSchedTime").value;
  const dur  = parseInt(document.getElementById("tkSchedDur").value,10) || 60;
  const calId = document.getElementById("tkSchedCal").value || "primary";
  if(!date || !time){ toast("日付と開始時刻を入れてください"); return; }
  const [hh,mm] = time.split(":").map(Number);
  let endMin = hh*60+mm+dur; if(endMin>1439) endMin=1439;
  const endStr = pad(Math.floor(endMin/60))+":"+pad(endMin%60);
  const title = (document.getElementById("tkEditTitle").value||"").trim() || "（無題）";
  const body = {
    summary: title,
    start:{ dateTime: date+"T"+time+":00", timeZone: TZ },
    end:  { dateTime: date+"T"+endStr+":00", timeZone: TZ },
    extendedProperties:{ private:{ calappTask: id } }
  };
  try{
    const cur = taskSched[id];
    let ev;
    if(cur && cur.eventId && cur.calId===calId){
      ev = await api("/calendars/"+encodeURIComponent(calId)+"/events/"+encodeURIComponent(cur.eventId), { method:"PATCH", body: JSON.stringify(body) });
    }else{
      if(cur && cur.eventId){ try{ await api("/calendars/"+encodeURIComponent(cur.calId)+"/events/"+encodeURIComponent(cur.eventId), { method:"DELETE" }); }catch(_){} }
      ev = await api("/calendars/"+encodeURIComponent(calId)+"/events", { method:"POST", body: JSON.stringify(body) });
    }
    taskSched[id] = { calId, eventId: ev.id, date, time, end: endStr };
    saveSettingsDesc();
    closeTaskEdit();
    if(LIVE) loadLive();                 // カレンダー側にも反映させる
    else renderView();
    toast("カレンダーに入れました");
  }catch(err){ toast("カレンダー化に失敗: "+(err.message||err)); }
}
async function unscheduleTask(){
  if(!tkEditRef) return;
  const id = tkEditRef.taskId, cur = taskSched[id];
  if(!cur) return;
  try{ await api("/calendars/"+encodeURIComponent(cur.calId)+"/events/"+encodeURIComponent(cur.eventId), { method:"DELETE" }); }catch(_){}
  delete taskSched[id]; saveSettingsDesc();
  closeTaskEdit();
  if(LIVE) loadLive(); else renderView();
  toast("予定を外しました");
}
document.getElementById("tkSchedAdd").addEventListener("click", scheduleTask);
document.getElementById("tkSchedRemove").addEventListener("click", unscheduleTask);
/* タスクを完了/削除する時、紐づいたカレンダー予定も消す */
async function dropLinkedEvent(id){
  const cur = taskSched[id];
  if(!cur) return;
  try{ await api("/calendars/"+encodeURIComponent(cur.calId)+"/events/"+encodeURIComponent(cur.eventId), { method:"DELETE" }); }catch(_){}
  delete taskSched[id];
}
function closeTaskEdit(){
  tkEditRef = null;
  document.getElementById("tkEdit").classList.remove("on");
  document.getElementById("tkEditBd").classList.remove("on");
}
async function saveTaskEdit(){
  if(!tkEditRef) return;
  const { listId, taskId } = tkEditRef;
  const title = (document.getElementById("tkEditTitle").value||"").trim();
  const dueVal = document.getElementById("tkEditDue").value;
  const newList = document.getElementById("tkEditList").value;
  if(!title){ document.getElementById("tkEditTitle").focus(); return; }
  const due = dueVal ? dueVal+"T00:00:00.000Z" : null;
  try{
    const g = taskData.find(x=>x.list.id===listId);
    if(newList && newList !== listId){
      // タグ変更＝別リストへ作り直して元を削除（TasksにはList間moveが無い）
      const old = g && g.tasks.find(t=>t.id===taskId);
      const body = { title }; if(due) body.due = due; if(old && old.notes) body.notes = old.notes;
      const created = await apiTasks("/lists/"+encodeURIComponent(newList)+"/tasks", { method:"POST", body: JSON.stringify(body) });
      await apiTasks("/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(taskId), { method:"DELETE" });
      if(g) g.tasks = g.tasks.filter(t=>t.id!==taskId);
      const ng = taskData.find(x=>x.list.id===newList); if(ng && created) ng.tasks.unshift(created);
    }else{
      const updated = await apiTasks("/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(taskId),
        { method:"PATCH", body: JSON.stringify({ title, due }) });
      const t = g && g.tasks.find(x=>x.id===taskId);
      if(t){ t.title = title; if(updated && updated.due) t.due = updated.due; else delete t.due; }
    }
    closeTaskEdit(); renderView(); toast("保存しました");
  }catch(err){ toast("保存に失敗: "+(err.message||err)); }
}
async function deleteTask(){
  if(!tkEditRef) return;
  if(!confirm("このタスクを削除しますか？")) return;
  const { listId, taskId } = tkEditRef;
  try{
    await apiTasks("/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(taskId), { method:"DELETE" });
    const g = taskData.find(x=>x.list.id===listId); if(g) g.tasks = g.tasks.filter(t=>t.id!==taskId);
    let ch=false;
    if(matrixPos[taskId]){ delete matrixPos[taskId]; ch=true; }
    if(taskSched[taskId]){ await dropLinkedEvent(taskId); ch=true; }
    if(ch) saveSettingsDesc();
    closeTaskEdit(); renderView(); toast("削除しました");
  }catch(err){ toast("削除に失敗: "+(err.message||err)); }
}
document.getElementById("tkEditBd").addEventListener("click", closeTaskEdit);  // 背景クリックで閉じる
document.getElementById("tkEditSave").addEventListener("click", saveTaskEdit);
document.getElementById("tkEditDel").addEventListener("click", deleteTask);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeTaskEdit(); });  // Escで閉じる
async function addTask(){
  const listId = (document.getElementById("tkAddList")||{}).value;
  const titleEl = document.getElementById("tkAddTitle");
  const dueEl = document.getElementById("tkAddDue");
  const title = (titleEl.value||"").trim();
  if(!listId){ toast("先にタグ（リスト）を作ってください"); return; }
  if(!title){ titleEl.focus(); return; }
  const body = { title };
  if(dueEl && dueEl.value) body.due = dueEl.value + "T00:00:00.000Z";   // Tasksは日付だけ保存

    const created = await apiTasks("/lists/"+encodeURIComponent(listId)+"/tasks", { method:"POST", body: JSON.stringify(body) });

    const t = document.getElementById("tkAddTitle"); if(t) t.focus();

  }catch(err){ toast("追加に失敗: "+(err.message||err)); }
}
async function addTagList(){
  const name = prompt("新しいタグ（リスト）の名前");
  if(!name || !name.trim()) return;
  try{
    const created = await apiTasks("/users/@me/lists", { method:"POST", body: JSON.stringify({ title:name.trim() }) });

/* ============================================================
   時間軸ビュー（スクロール／3日で共通のパーツ）
   ============================================================ */
function toMin(hm){ const [h,m]=hm.split(":").map(Number); return h*60+(m||0); }
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
// 赤線に添えるラベル（2段：日付 / 実時刻 HH:MM）
function nowLabel(){
  const d = new Date();
  return (d.getMonth()+1) + "/" + d.getDate() + "<br>" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

/* ---- 作成・編集まわりの小道具（座標⇔分・スナップ・編集可否） ---- */
function yToMin(px){ return Math.max(0, Math.min(1440, (px/PXH)*60)); }  // グリッド内Y(px) → 分(0..1440)
function minToY(min){ return (min/60)*PXH; }                             // 分 → Y(px)
function snapMin(min){ return Math.round(min/15)*15; }                   // 15分刻みに丸める
function minToHM(min){ min=Math.max(0,Math.min(1440,Math.round(min))); return pad(Math.floor(min/60))+":"+pad(min%60); }
let localSeq = 0;   // モック時に作った予定の一時ID用
/* この予定をツール上で編集（移動/長さ変更/名前/削除）してよいか
   ・終日/複数日はダメ（見るだけ）・繰り返しはダメ・focusTimeやtask等の特殊タイプはダメ
   ・閲覧のみのカレンダーはダメ */
function editable(e){
  if(!e || e.allDay || !e.time) return false;
  if(e.routine) return false;
  if(e.eventType && e.eventType !== "default") return false;
  const cal = calById(e.calId);
  if(cal && cal.writable === false) return false;
  return true;
}
/* 新規作成の既定カレンダー = 「仕事」。無ければ書き込み可の先頭 */
function defaultCalId(){
  const w = calendars.filter(c=> c.writable !== false);
  const shigoto = w.find(c=> c.name==="仕事") || calendars.find(c=> c.name==="仕事");
  return (shigoto && shigoto.id) || (w[0] && w[0].id) || "primary";
}

/* その日の時刻付き予定を、重なりを列に振り分けて返す */
function timedOf(d, vis){
  const minMin = MINEV_H / PXH * 60;      // 最小高さぶんを「分」に換算（見た目の占有量）
  const timed = vis.filter(e=>e.date===d && !e.allDay && e.time).map(e=>{
    const s = toMin(e.time);
    let en = e.end ? toMin(e.end) : s+30;
    if(en <= s) en = Math.min(s+30, 24*60);
    // enEff = 実際の終了か「最小高さ相当の終了」の遅い方。これで見た目が重なる分も分割対象にする
    const enEff = Math.max(en, s + minMin);
    return { e, s, en, enEff };
  });
  packColumns(timed);
  return timed;
}
/* 1件の予定ブロック（絶対配置）。列は position:relative な入れ物側で受ける */
function evBtnHtml(o){
  const cal = calById(o.e.calId) || {color:"var(--ink)"};
  const top = (o.s/60)*PXH + 1, hgt = Math.max((o.en-o.s)/60*PXH - 2, MINEV_H);   // 上下1pxずつ空けて重なりを緩和
  const w = 100/o.ncol, left = o.col*w;
  const short = hgt < 40;                 // 背が低い枠は1行にまとめる
  const canEdit = editable(o.e);
  const cls = ["tl-ev", short?"short":"", o.e.routine?"routine":"", o.e.done?"done":"", canEdit?"canmove":""].join(" ");
  const border = o.e.done ? "var(--gray)" : cal.color;
  // 済でなければカレンダー色の塗りで濃くする（背景に埋もれないように）
  const bg = o.e.done ? "" : `background:color-mix(in srgb, ${cal.color} 42%, #fff);`;
  const label = o.e.time + (o.e.end?("–"+o.e.end):"");
  const grip = canEdit ? `<span class="grip" aria-hidden="true"></span>` : "";
  return `<button class="${cls}" data-id="${esc(o.e.id)}"
    style="top:${top}px;height:${hgt}px;left:calc(${left}% + 1px);width:calc(${w}% - 2px);border-color:${border};${bg}">
    <span class="t">${label}</span><span class="ttl">${esc(o.e.title)}</span>${grip}</button>`;
}
/* その日にこの予定がかかっているか。終日は複数日にまたがる（endは排他的な翌日） */
function onDay(e, d){
  if(e.allDay && e.endDate) return e.date <= d && d < e.endDate;
  return e.date === d;
}
/* その日の終日予定のボタン群 */
function allDayBtns(d, vis){
  return vis.filter(e=>onDay(e,d) && (e.allDay || !e.time)).map(e=>{
    const cal = calById(e.calId) || {color:"var(--ink)"};
    const cls = ["ad", e.routine?"routine":"", e.done?"done":""].join(" ");
    const border = e.done ? "var(--gray)" : cal.color;
    const bg = e.done ? "" : `background:color-mix(in srgb, ${cal.color} 42%, #fff);`;
    return `<button class="${cls}" data-id="${esc(e.id)}" style="border-color:${border};${bg}">${esc(e.title)}</button>`;
  }).join("");
}
const hoursCol = () => Array.from({length:25}, (_,h)=>
  `<div class="tl-hour h${h}" style="top:${h*PXH}px"><span>${h}時</span></div>`).join("");

/* ---- スクロール（一枚もの）: 0〜24時グリッドを日ごとに縦連結 ---- */
function renderScroll(days){
  const vis = visibleEvents();
  const nm = nowMinutes();
  return `<div class="scrollwrap">` + days.map(d=>{
    const k = wdOf(d);
    const evs = timedOf(d,vis).map(evBtnHtml).join("");
    const nowTop = (nm/60)*PXH;
    const nowLine = (d===TODAY)
      ? `<div class="tl-now" style="top:${nowTop}px"></div><div class="tl-nowlab" style="top:${nowTop}px">${nowLabel()}</div>`
      : "";
    const ad = allDayBtns(d,vis);
    const lblCls = ["tl-daylabel", k===0?"sun":k===6?"sat":"", d===TODAY?"today":""].join(" ");
    return `<section class="tl-day">
      <div class="tl-dayhead">
        <div class="${lblCls}"><span class="dn">${+d.split("-")[2]}</span><span class="dw">${WK[k]}曜日 · ${md(d)}</span></div>
        ${ad ? `<div class="tl-allday"><span class="tl-adlabel">終日</span>${ad}</div>` : ""}
      </div>
      <div class="tl-grid" data-date="${d}" style="height:${24*PXH}px">${hoursCol()}${nowLine}${evs}</div>
    </section>`;
  }).join("") + `</div>`;
}

/* ---- 3日ビュー: 3日を横に並べ、縦を時間軸に ---- */
function renderDay3(days){
  const vis = visibleEvents();
  const nm = nowMinutes();
  const H = 24*PXH;
  const heads = days.map(d=>{
    const k = wdOf(d);
    const cls = ["d3dh", k===0?"sun":k===6?"sat":"", d===TODAY?"today":""].join(" ");
    return `<div class="${cls}"><span class="d3dn">${+d.split("-")[2]}</span><span class="d3dw">${WK[k]}</span></div>`;
  }).join("");
  const hasAd = days.some(d=>vis.some(e=>onDay(e,d) && (e.allDay || !e.time)));
  const adRow = days.map(d=>`<div class="d3adcell">${allDayBtns(d,vis)}</div>`).join("");
  const nowTop = (nm/60)*PXH;
  const gutter = Array.from({length:25}, (_,h)=>`<div class="d3hr" style="top:${h*PXH}px">${h}時</div>`).join("")
    + (days.indexOf(TODAY) >= 0 ? `<div class="tl-nowlab" style="top:${nowTop}px">${nowLabel()}</div>` : "");
  const cols = days.map(d=>{
    const lines = Array.from({length:25}, (_,h)=>`<div class="d3line h${h}" style="top:${h*PXH}px"></div>`).join("");
    const evs = timedOf(d,vis).map(evBtnHtml).join("");
    const nowLine = (d===TODAY) ? `<div class="tl-now" style="top:${nowTop}px"></div>` : "";
    return `<div class="d3col${d===TODAY?" today":""}" data-date="${d}" style="height:${H}px">${lines}${nowLine}${evs}</div>`;
  }).join("");
  return `<div class="d3">
    <div class="d3head"><div></div>${heads}</div>
    ${hasAd ? `<div class="d3adrow"><div class="d3adlabel">終日</div>${adRow}</div>` : ""}
    <div class="d3body"><div class="d3gutter" style="height:${H}px">${gutter}</div>${cols}</div>
  </div>`;
}

/* ---- アイゼンハワー・マトリクス（Google Tasks を配置） ---- */
const MX_PALETTE = ["#3F5A73","#B4472F","#5E7A5E","#8A6D1F","#6B5B7B","#2F6FB5","#B07A3F","#4A7C7C"];
function matrixTagSet(){
  if(matrixTags) return new Set(matrixTags);            // ユーザー選択
  return new Set((taskData||[]).map(g=>g.list.id));     // 既定は全タグ
}
function mxCardHtml(o, pos){
  const col = MX_PALETTE[o.idx % MX_PALETTE.length];
  const style = pos ? `left:${(pos.x*100).toFixed(2)}%;top:${(pos.y*100).toFixed(2)}%;` : "";
  const due = o.t.due ? " · "+mdFromDue(o.t.due) : "";
  const sch = taskSched[o.t.id] ? `<span class="mx-sch" title="予定済み ${esc(taskSched[o.t.id].date)} ${esc(taskSched[o.t.id].time)}">📅</span>` : "";
  return `<div class="mx-card${pos?" placed":""}${taskSched[o.t.id]?" sched":""}" data-id="${esc(o.t.id)}" data-list="${esc(o.list.id)}"
    style="${style}border-color:${col};background:color-mix(in srgb, ${col} 20%, #fff)">
    <span class="mx-check" title="完了"></span>
    <span class="mx-body"><span class="mx-when">${esc(o.list.title)}${due}</span><span class="mx-ttl">${esc(o.t.title||"(無題)")}</span></span>
    ${sch}
  </div>`;
}
function renderMatrix(){

/* カードのドラッグ（動かさなければタップ＝ポップオーバー） */
function mxDrag(ev, card){
  if(ev.button !== undefined && ev.button !== 0) return;
  ev.preventDefault();
  const id = card.dataset.id;
  const grid = document.getElementById("mxGrid"), tray = document.getElementById("mxTray");
  const r = card.getBoundingClientRect(), w = r.width, h = r.height;
  const startX = ev.clientX, startY = ev.clientY;
  let moved = false;
  try{ card.setPointerCapture(ev.pointerId); }catch(_){}
  const move = e=>{
    if(!moved && Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY) > 5){
      moved = true;
      card.classList.add("mx-drag");
      card.style.position="fixed"; card.style.width=w+"px"; card.style.zIndex=100;
      card.style.transform="none"; card.style.pointerEvents="none";
    }
    if(moved){ card.style.left=(e.clientX-w/2)+"px"; card.style.top=(e.clientY-h/2)+"px"; }
  };
  const up = e=>{
    card.removeEventListener("pointermove",move);
    card.removeEventListener("pointerup",up);
    card.removeEventListener("pointercancel",up);
    if(!moved){ openTaskEdit(card.dataset.list, id); return; }   // タップ → タスク編集
    const g = grid.getBoundingClientRect(), t = tray.getBoundingClientRect();
    const inTray = e.clientX>=t.left && e.clientX<=t.right && e.clientY>=t.top && e.clientY<=t.bottom;
    if(inTray){ delete matrixPos[id]; }
    else {
      let x=(e.clientX-g.left)/g.width, y=(e.clientY-g.top)/g.height;
      matrixPos[id] = { x:Math.max(0,Math.min(1,x)), y:Math.max(0,Math.min(1,y)) };
    }
    saveSettingsDesc(); renderView();
  };
  card.addEventListener("pointermove",move);
  card.addEventListener("pointerup",up);
  card.addEventListener("pointercancel",up);
}

/* 重なる予定を列に割り当てる（col: 列番号, ncol: そのかたまりの列数） */
function packColumns(items){
  // 見た目の占有量 enEff で「重なるかどうか」を判定して列に振り分ける
  items.sort((a,b)=> a.s-b.s || a.enEff-b.enEff);
  let i=0;
  while(i<items.length){
    const cluster=[items[i]]; let maxEnd=items[i].enEff, j=i+1;
    while(j<items.length && items[j].s < maxEnd){ cluster.push(items[j]); maxEnd=Math.max(maxEnd,items[j].enEff); j++; }
    const colEnds=[];
    for(const o of cluster){
      let c = colEnds.findIndex(end=> end<=o.s);
      if(c===-1){ c=colEnds.length; colEnds.push(o.enEff); } else colEnds[c]=o.enEff;
      o.col=c;
    }
    for(const o of cluster) o.ncol=colEnds.length;
    i=j;
  }
}

function chipHtml(e, cal){
  const cls = ["chip", e.routine?"routine":"", e.allDay?"allday":"", e.done?"done":""].join(" ");
  const border = e.done ? "var(--gray)" : cal.color;
  const t = e.allDay ? "終日" : (e.time + (e.end?("–"+e.end):""));
  return `<button class="${cls}" data-id="${esc(e.id)}" style="border-color:${border}">
      <span class="seal">済</span>
      <span class="t">${t}</span><span class="ttl">${esc(e.title)}</span>
    </button>`;
}

/* --- 空きスペースをドラッグして新規作成 --- */
let creating = null;
function gridPointerDown(ev, gridEl, date){
  if(ev.button) return;                          // 左クリックのみ
  if(ev.target.closest(".tl-ev")) return;        // 既存予定の上では作らない
  if(!date) return;
  ev.preventDefault();
  const rect = gridEl.getBoundingClientRect();
  const startMin = snapMin(yToMin(ev.clientY - rect.top));
  const box = document.createElement("div");
  box.className = "tl-creating";
  gridEl.appendChild(box);
  creating = { rect, date, startMin, curMin:startMin, box };
  const layout = ()=>{
    const a = Math.min(creating.startMin, creating.curMin), b = Math.max(creating.startMin, creating.curMin);
    let top = snapMin(a), bot = Math.max(snapMin(b), top+15);
    box.style.top = minToY(top)+"px";
    box.style.height = (minToY(bot)-minToY(top))+"px";
    box.textContent = minToHM(top)+"–"+minToHM(bot);
  };
  layout();
  const move = e=>{ creating.curMin = snapMin(yToMin(e.clientY - rect.top)); layout(); };
  const up = e=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    const a = Math.min(creating.startMin, creating.curMin), b = Math.max(creating.startMin, creating.curMin);
    let s = snapMin(a), en = snapMin(b);
    if(en < s+15) en = s+30;                      // ほぼ動かさなかった→既定30分
    if(en > 1440) en = 1440;
    box.remove(); creating = null;
    openCreate(date, s, en);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* --- 既存の時間予定：ドラッグで移動、下端(グリップ)で長さ変更、動かさなければタップ=シート --- */
function evPointerDown(ev, el, e){
  if(ev.button) return;
  ev.stopPropagation();                           // グリッドの新規作成を抑制
  const canEdit = editable(e);
  const isResize = canEdit && ev.target.classList.contains("grip");
  ev.preventDefault();
  const gridEl = el.parentElement, gridRect = gridEl.getBoundingClientRect();
  const origStart = toMin(e.time);
  const origEnd = e.end ? toMin(e.end) : origStart+30;
  const dur = Math.max(15, origEnd - origStart);
  const startY = ev.clientY;
  let moved = false, newStart = origStart, newEnd = origEnd;
  const move = me=>{
    const dy = me.clientY - startY;
    if(!moved && Math.abs(dy) > 4) moved = true;
    if(!moved || !canEdit) return;
    el.classList.add("editing");
    if(isResize){
      newEnd = snapMin(yToMin(me.clientY - gridRect.top));
      if(newEnd < origStart+15) newEnd = origStart+15;
      el.style.height = Math.max(minToY(newEnd)-minToY(origStart)-2, MINEV_H)+"px";
    }else{
      newStart = snapMin(origStart + (dy/PXH)*60);
      if(newStart < 0) newStart = 0;
      if(newStart > 1440-dur) newStart = 1440-dur;
      newEnd = newStart + dur;
      el.style.top = (minToY(newStart)+1)+"px";
    }
  };
  const up = async me=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    el.classList.remove("editing");
    if(!moved){ openSheet(e.id, el); return; }     // 動かしていない→タップ扱い
    if(!canEdit) return;
    try{ await patchTime(e, minToHM(newStart), minToHM(newEnd)); }
    catch(err){ toast("変更に失敗: "+(err.message||err)); renderView(); }
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* --- Google/ローカルへ反映する処理 --- */
async function patchTime(e, newTime, newEnd){
  if(LIVE && e.gid){
    const path = "/calendars/"+encodeURIComponent(e.calId)+"/events/"+encodeURIComponent(e.gid);
    await api(path, { method:"PATCH", body: JSON.stringify({
      start:{ dateTime:e.date+"T"+newTime+":00", timeZone:TZ },
      end:  { dateTime:e.date+"T"+newEnd+":00",  timeZone:TZ }
    }) });
  }
  e.time = newTime; e.end = newEnd;
  renderView(); toast("時間を変更しました "+newTime+"–"+newEnd);
}

let sheetId = null;
function openSheet(id, anchorEl){
  const e = events.find(x=>x.id===id); if(!e) return;
  sheetId = id;
  const cal = calById(e.calId);
  const when = md(e.date)+" ("+WK[wdOf(e.date)]+") "+(e.allDay?"終日":(e.time+(e.end?("–"+e.end):"")));
  document.getElementById("sheetTitle").textContent = e.title;
  const writable = !cal || cal.writable !== false;   // モック/不明は許可、reader等は不可
  document.getElementById("sheetMeta").textContent =
    when + " · " + (cal?cal.name:"") + (e.routine?" · 繰り返し":" · 単発")
    + (e.done && e.doneAt ? " · 済 "+e.doneAt : "")
    + (editable(e) ? " · ドラッグで移動／下端で長さ変更" : "")
    + (writable ? "" : " · 閲覧のみ（済にするとこのアプリで非表示）");
  const acts = document.getElementById("sheetActions");
  // 予定の作成・削除・時間変更などの本格的な編集は Google 側に任せる（このボタンで飛ぶ）
  const openBtn = e.htmlLink
    ? `<a class="btn" id="act-open" href="${esc(e.htmlLink)}" target="_blank" rel="noopener">Googleで開く</a>`
    : "";
  // 書き込み可＝Googleを更新して済。閲覧のみ＝アプリ上だけ非表示（ローカル済）。どちらもボタンは同じ
  const doneBtn = e.done
    ? `<button class="btn" id="act-undo">済を取り消す</button>`
    : `<button class="btn primary" id="act-done">済にする</button>`;
  // 編集できる時間予定だけ、名前変更と削除も出す
  const editBtns = editable(e)
    ? `<button class="btn" id="act-rename">名前変更</button><button class="btn" id="act-del">削除</button>`
    : "";
  acts.innerHTML = doneBtn + editBtns + openBtn;
  acts.querySelector("#act-done") && acts.querySelector("#act-done").addEventListener("click",()=>markDone(id,true));
  acts.querySelector("#act-undo") && acts.querySelector("#act-undo").addEventListener("click",()=>markDone(id,false));
  acts.querySelector("#act-rename") && acts.querySelector("#act-rename").addEventListener("click",()=>renameEvent(e));
  acts.querySelector("#act-del") && acts.querySelector("#act-del").addEventListener("click",()=>deleteEventNow(e));

  sheet.classList.add("on");

}
/* ポップオーバーを予定の近くに配置（下に入らなければ上へ、画面端でクランプ） */
function positionSheet(anchorEl){
  const sheet = document.getElementById("sheet");
  const sw = sheet.offsetWidth, sh = sheet.offsetHeight, gap = 6, pad = 8;
  const r = anchorEl ? anchorEl.getBoundingClientRect()
                     : { top:window.innerHeight/2, bottom:window.innerHeight/2, left:window.innerWidth/2 };
  let top = r.bottom + gap;
  if(top + sh > window.innerHeight - pad) top = r.top - sh - gap;   // 下に入らなければ上に
  top = Math.max(pad, Math.min(top, window.innerHeight - sh - pad));
  let left = Math.max(pad, Math.min(r.left, window.innerWidth - sw - pad));
  sheet.style.top = top + "px";
  sheet.style.left = left + "px";
}
function closeSheet(){
  sheetId = null;
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheetBackdrop").classList.remove("on");
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);

async function markDone(id, done){
  const e = events.find(x=>x.id===id); if(!e) return;
  const cal = calById(e.calId);
  const writable = !cal || cal.writable !== false;
  if(writable){
    if(LIVE){
      try{ await patchDone(e, done); }
      catch(err){ toast("書き込みに失敗しました: "+(err.message||err)); return; }
    }
  }else{
    // 読み取り専用 → Googleは変えず、アプリ上だけ隠す（ローカル済・両端末同期）
    if(done) localDone.add(e.id); else localDone.delete(e.id);
    saveSettingsDesc();
  }
  e.done = done;
  e.doneAt = done ? nowStamp() : "";
  closeSheet(); renderView();
  const colState = (LIVE && writable) ? "／Google保存後の色=" + (e.colorId ? "ID " + e.colorId : "既定(クリア済)") : "";
  const how = writable ? (done ? "（灰色に）" : "") : (done ? "（このアプリで非表示）" : "（再表示）");
  toast((done ? "済にしました" : "済を取り消しました") + how + colState);
}

function nowStamp(){
  const d = new Date();
  return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}

/* ============================================================
   Google カレンダー API（実データ）
   ============================================================ */
function initTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPE,
    callback: (resp)=>{
      if(resp.error){
        if(!silentAttempt) toast("認証に失敗しました: "+resp.error);   // 裏での取り直し失敗は黙って諦める
        silentAttempt = false; return;
      }
      silentAttempt = false;
      TOKEN = resp.access_token; LIVE = true;
      saveToken(resp.access_token, resp.expires_in);
      try{ localStorage.setItem("cal_seen","1"); }catch(e){}
      markConnected(true);
      loadLive();
    }
  });
  return true;
}

function connect(){
  if(!CONFIG.CLIENT_ID){
    toast("CLIENT_ID が未設定です（モードはモックのまま）");
    return;
  }
  if(!tokenClient && !initTokenClient()){
    toast("Google のスクリプトがまだ読み込まれていません。少し待って再度お試しください。");
    return;
  }
  tokenClient.requestAccessToken({ prompt: TOKEN ? "" : "consent" });
}

/* ---- 自動再接続：トークンを保存して次回は黙って再開する ---- */
const TOK_KEY = "cal_token_v1";
let silentAttempt = false;              // 裏で静かに取り直し中か（エラートーストを抑えるため）
function saveToken(token, expiresInSec){
  try{ localStorage.setItem(TOK_KEY, JSON.stringify({ token, expiresAt: Date.now() + (expiresInSec||3600)*1000 })); }catch(e){}
}
function loadStoredToken(){
  try{ const o = JSON.parse(localStorage.getItem(TOK_KEY)||"null"); return (o && o.token && o.expiresAt) ? o : null; }catch(e){ return null; }
}
function clearToken(){ try{ localStorage.removeItem(TOK_KEY); }catch(e){} }
function markConnected(live){
  setStatus(live);
  document.getElementById("reload").disabled = !live;
  document.getElementById("connect").textContent = live ? "再接続" : "Googleに接続";
}
function whenGisReady(cb, tries){
  tries = tries || 0;
  if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
  if(tries > 40) return;                // 最大約8秒待つ
  setTimeout(()=>whenGisReady(cb, tries+1), 200);
}
function silentReconnect(){
  if(localStorage.getItem("cal_seen") !== "1") return;   // 一度もつないでいなければ何もしない
  whenGisReady(()=>{
    if(tokenClient || initTokenClient()){ silentAttempt = true; tokenClient.requestAccessToken({ prompt: "" }); }
  });
}
function autoReconnect(){
  if(!CONFIG.CLIENT_ID) return;
  const t = loadStoredToken();
  if(t && t.expiresAt > Date.now() + 15000){    // まだ有効 → Google操作なしで即再開
    TOKEN = t.token; LIVE = true; markConnected(true);
    loadLive();
    return;
  }
  clearToken();
  silentReconnect();                            // 期限切れ/無し → 静かに取り直しを試す（無理ならモックのまま）
}

async function api(path, opts){
  const res = await fetch("https://www.googleapis.com/calendar/v3"+path, Object.assign({
    headers: { "Authorization":"Bearer "+TOKEN, "Content-Type":"application/json" }
  }, opts));
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(res.status+" "+t.slice(0,140));
  }
  return res.status===204 ? null : res.json();
}
/* Google Tasks API（別ドメイン） */
async function apiTasks(path, opts){
  const res = await fetch("https://tasks.googleapis.com/tasks/v1"+path, Object.assign({
    headers: { "Authorization":"Bearer "+TOKEN, "Content-Type":"application/json" }
  }, opts));
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(res.status+" "+t.slice(0,140));
  }
  return res.status===204 ? null : res.json();
}
/* タスク（Google ToDo）を読み込む：リスト=タグ ごとにタスクを取得 */
let taskData = null;        // [{list:{id,title}, tasks:[...]}]
let taskLoading = false;
async function loadTasks(){
  if(!LIVE || taskLoading) return;
  taskLoading = true;
  try{
    const lists = await apiTasks("/users/@me/lists?maxResults=100");
    const out = [];
    for(const l of (lists.items||[])){
      const q = new URLSearchParams({ maxResults:"100", showCompleted:"false" });
      let data; try{ data = await apiTasks("/lists/"+encodeURIComponent(l.id)+"/tasks?"+q.toString()); }
      catch(e){ data = { items:[] }; }
      out.push({ list:{ id:l.id, title:l.title }, tasks:(data.items||[]) });
    }
    taskData = out;
  }catch(err){
    const msg = String(err.message||err);
    if(/^40[13]/.test(msg)) toast("タスクの権限がありません。『再接続』で許可してください。");
    else toast("タスクの読み込みに失敗: "+msg);
    taskData = [];
  }finally{
    taskLoading = false;
    if(mode==="tasks") renderView();
  }
}

async function loadLive(){
  try{
    toast("カレンダーを読み込み中…");
    const list = await api("/users/me/calendarList");
    calendars = (list.items||[]).map(c=>({
      id: c.id,
      name: c.summaryOverride || c.summary,
      color: c.backgroundColor || "#888",
      off: c.selected===false,
      // 書き込み権限があるカレンダーだけ「済」を許可する（閲覧のみ/共有は不可）
      writable: c.accessRole === "owner" || c.accessRole === "writer",
      accessRole: c.accessRole || ""
    }));
    // 表示範囲だけ取得する
    const { timeMin, timeMax } = fetchRange();
    const all = [];
    for(const c of calendars){
      const q = new URLSearchParams({
        timeMin: timeMin.toISOString(), timeMax: timeMax.toISOString(),
        singleEvents:"true", orderBy:"startTime", maxResults:String(CONFIG.MAX_EVENTS)
      });
      let data;
      try{ data = await api("/calendars/"+encodeURIComponent(c.id)+"/events?"+q.toString()); }
      catch(err){ continue; }        // 読めないカレンダーは飛ばす
      for(const it of (data.items||[])) all.push(normalize(it, c.id));
    }
    events = all;
    pendingScrollNow = true;              // 接続直後は現在時刻へ寄せる
    renderCals(); renderView();
    loadBannerRemote();                   // 一言スペースの共有文章をGoogleから取得
    toast("読み込み完了（"+events.length+"件）");
  }catch(err){
    const msg = String(err.message||err);
    if(/^401/.test(msg)){                 // トークン失効 → モックへ戻し、静かに取り直しを試す
      clearToken(); TOKEN=null; LIVE=false; markConnected(false);
      calendars = mockCalendars(); events = mockEvents(); renderCals(); renderView();
      toast("接続の期限が切れました。取り直します…");
      silentReconnect();
      return;
    }
    toast("読み込みに失敗しました: "+msg);
  }
}

function normalize(it, calId){
  const allDay = !!(it.start && it.start.date);
  const startStr = allDay ? it.start.date : it.start.dateTime;
  const endStr   = it.end ? (allDay ? it.end.date : it.end.dateTime) : "";
  const date = allDay ? it.start.date : ymd(new Date(startStr));
  // 終日予定は複数日にまたがることがある。end.date は「排他的な翌日」（Google仕様）
  const endDate = allDay ? ((it.end && it.end.date) ? it.end.date : ymd(addDays(parseYmd(date),1))) : "";
  const hm = s => { const d=new Date(s); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  const priv = (it.extendedProperties && it.extendedProperties.private) || {};
  return {
    id: calId+"::"+it.id,
    gid: it.id,
    calId,
    title: it.summary || "(無題)",
    allDay,
    date,
    endDate,
    time: allDay ? "" : hm(startStr),
    end:  (!allDay && endStr) ? hm(endStr) : "",
    routine: !!it.recurringEventId,
    eventType: it.eventType || "default",   // default 以外(focusTime/task等)は編集させない
    done: priv.done === "true",
    doneAt: priv.doneAt || "",
    prevColorId: priv.prevColorId || it.colorId || "",
    colorId: it.colorId || "",
    htmlLink: it.htmlLink || ""        // Googleカレンダーで開くためのリンク
  };
}

async function patchDone(e, done){
  // Google の PATCH は「未指定/null のフィールドは変更しない」ため、colorId を
  // null で送っても既定色に戻せない。そこで「取得→編集→PUT(全体更新)」で行う。
  // PUT は送らなかったフィールドがクリアされるので、colorId を削除すれば既定色に戻る。
  const path = "/calendars/"+encodeURIComponent(e.calId)+"/events/"+encodeURIComponent(e.gid);
  const ev = await api(path);                                  // イベント全体を取得
  ev.extendedProperties = ev.extendedProperties || {};
  ev.extendedProperties.private = ev.extendedProperties.private || {};
  const priv = ev.extendedProperties.private;

  if(done){
    priv.prevColorId = ev.colorId || "";     // 現在の色を控える（既定色なら""）
    priv.done   = "true";
    priv.doneAt = new Date().toISOString();
    ev.colorId  = CONFIG.GRAY_COLOR_ID;      // 灰色にする
  }else{
    const prev = priv.prevColorId || "";
    if(prev) ev.colorId = prev;              // 元が個別色 → その色へ戻す
    else     delete ev.colorId;              // 元が既定色 → colorId を消して既定へ
    delete priv.done; delete priv.doneAt; delete priv.prevColorId;
  }

  const updated = await api(path, { method:"PUT", body: JSON.stringify(ev) });
  if(updated){
    const p = (updated.extendedProperties && updated.extendedProperties.private) || {};
    e.colorId = updated.colorId || "";
    e.prevColorId = p.prevColorId || "";
  }
  return updated;
}

function setStatus(live){

/* ============================================================
   現在時刻ラインの自動更新（再読み込み不要で赤線が動く）
   ============================================================ */
function tickNow(){
  const today = ymd(new Date());
  if(today !== TODAY){ TODAY = today; renderView(); return; }   // 日付をまたいだら描き直す
  const nm = nowMinutes();
  const top = ((nm/60)*PXH) + "px";
  document.querySelectorAll(".tl-now").forEach(el=> el.style.top = top);
  document.querySelectorAll(".tl-nowlab").forEach(el=>{ el.style.top = top; el.innerHTML = nowLabel(); });
  updateNowBtn();
}
setInterval(tickNow, 30000);   // 30秒ごとに位置を更新

/* ============================================================
   現在時刻（赤線）へ戻る：起動時は自動、離れたら右下の「今」ボタン
   ============================================================ */
function scrollToNow(smooth){
  const el = document.querySelector(".tl-now");
  if(!el) return;
  const r = el.getBoundingClientRect();
  const target = window.scrollY + r.top - window.innerHeight/3;   // 画面の上から1/3あたりへ
  window.scrollTo({ top: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
}
function updateNowBtn(){
  const fabs = document.getElementById("fabs");
  if(fabs) fabs.classList.add("show");               // 常に表示（押しても消えない）
}
/* ボタンを「カレンダー本文の右端」に合わせて置く（画面右端に飛ばさない） */
function positionFabs(){
  const fabs = document.getElementById("fabs");
  const anchor = document.querySelector(".banner");   // 本文と同じ幅(最大640px)
  if(!fabs || !anchor) return;
  const r = anchor.getBoundingClientRect();
  const w = fabs.offsetWidth || 54;
  let left = r.right + 12;                             // 本文のすぐ右外
  if(left + w > window.innerWidth - 10) left = window.innerWidth - w - 12;   // 画面をはみ出すなら右端へ
  fabs.style.left = Math.round(left) + "px";
  fabs.style.right = "auto";
}
document.getElementById("nowBtn").addEventListener("click", ()=>{
  if(document.querySelector(".tl-now")) scrollToNow(true);          // 赤線があればそこへ
  else { anchor = new Date(); pendingScrollNow = true; refresh(); } // 範囲外なら今日へ飛んでから
});
document.getElementById("topBtn").addEventListener("click", ()=>{
  window.scrollTo({ top:0, behavior:"smooth" });                    // 先頭へ戻る
});
let nowTick = false;
window.addEventListener("scroll", ()=>{
  if(nowTick) return; nowTick = true;
  requestAnimationFrame(()=>{ nowTick = false; updateNowBtn(); });
}, { passive:true });
window.addEventListener("resize", ()=>{ updateNowBtn(); positionFabs(); }, { passive:true });

/* ============================================================
   PWA: ホーム画面に追加すると全画面＆アイコンで起動できるように
   （manifest を実行時に生成して埋め込む。別ファイル不要・置き場所に依存しない）
   ============================================================ */
function installManifest(){
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>"
    + "<rect width='512' height='512' rx='96' fill='#23262A'/>"
    + "<rect x='112' y='120' width='288' height='280' rx='22' fill='#F7F7F4'/>"
    + "<rect x='112' y='120' width='288' height='58' rx='22' fill='#B4472F'/>"
    + "<g stroke='#D2D5CD' stroke-width='6'>"
    + "<line x1='140' y1='250' x2='372' y2='250'/><line x1='140' y1='312' x2='372' y2='312'/><line x1='140' y1='374' x2='372' y2='374'/></g>"
    + "<line x1='112' y1='292' x2='400' y2='292' stroke='#B4472F' stroke-width='9'/>"
    + "<circle cx='116' cy='292' r='13' fill='#B4472F'/></svg>";
  const icon = "data:image/svg+xml," + encodeURIComponent(svg);
  const dir = location.origin + location.pathname.replace(/[^/]*$/, "");
  const manifest = {
    name: "カレンダー", short_name: "カレンダー",
    start_url: location.origin + location.pathname,
    scope: dir,
    display: "standalone",
    background_color: "#F7F7F4", theme_color: "#F7F7F4",
    icons: [
      { src: icon, sizes: "any",     type: "image/svg+xml", purpose: "any" },
      { src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
  const link = document.createElement("link");
  link.rel = "manifest"; link.href = url;
  document.head.appendChild(link);

  // ファビコン(タブ/ブックマーク)は <head> に静的に置いてある（JS注入だと出たり出なかったりするため）

  // iOS 用のアイコンも同じ絵で（ホーム画面追加時）
  const al = document.createElement("link");
  al.rel = "apple-touch-icon"; al.href = icon;
  document.head.appendChild(al);
}

/* ---- 上部の一言スペース：端末に即保存＋Google側にも保存して両端末で共有 ---- */
let bannerEventId = null;                 // Google側の保管用イベントID
let bannerSaveTimer = null;
let localDone = new Set();                // 読み取り専用の予定を「アプリ上だけ済（非表示）」にしたID
try{ localDone = new Set(JSON.parse(localStorage.getItem("cal_localdone")||"[]")); }catch(e){}
function setBannerH(){                     // 固定バナーの高さを CSS 変数へ（3日ビューの見出し位置に使う）
  const b = document.querySelector(".banner");
  if(b) document.documentElement.style.setProperty("--bannerH", b.offsetHeight + "px");
}
function fitBanner(){                      // 入力欄の高さを中身に合わせる（自動で伸びる）
  const el = document.getElementById("bannerText");
  if(!el) return;
  el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px";   // +2 は枠線ぶん（最終行が切れないように）
  setBannerH();
}
function initBanner(){
  const el = document.getElementById("bannerText");
  if(!el) return;
  try{ el.value = localStorage.getItem("cal_banner") || ""; }catch(e){}
  fitBanner();
  el.addEventListener("input", ()=>{
    const txt = el.value;
    try{ localStorage.setItem("cal_banner", txt); }catch(e){}
    fitBanner();
    clearTimeout(bannerSaveTimer);
    bannerSaveTimer = setTimeout(()=>saveBannerRemote(txt), 900);   // 少し待ってからGoogleへ
  });
  window.addEventListener("resize", fitBanner, { passive:true });
}
/* 接続後に呼ぶ：Google側の保管イベントから文章を読み込む */
async function loadBannerRemote(){
  if(!LIVE) return;
  try{
    const q = new URLSearchParams({ privateExtendedProperty:"calappBanner=1", maxResults:"1", singleEvents:"true" });
    const data = await api("/calendars/primary/events?"+q.toString());
    const ev = (data.items||[])[0];
    if(!ev) return;
    bannerEventId = ev.id;
    const t = (ev.extendedProperties && ev.extendedProperties.private && ev.extendedProperties.private.banner) || "";
    const el = document.getElementById("bannerText");
    if(el && document.activeElement !== el){    // 編集中でなければ反映
      el.value = t;
      try{ localStorage.setItem("cal_banner", t); }catch(e){}
      fitBanner();
    }
    // ローカル済＋マトリクス配置（description に JSON で保存してある）を取り込む
    try{ const d = JSON.parse(ev.description || "{}");
      if(Array.isArray(d.localDone)){ localDone = new Set(d.localDone);
        localStorage.setItem("cal_localdone", JSON.stringify([...localDone])); }
      if(d.matrixPos && typeof d.matrixPos === "object"){ matrixPos = d.matrixPos;
        localStorage.setItem("cal_matrixpos", JSON.stringify(matrixPos)); }
      if(d.taskSched && typeof d.taskSched === "object"){ taskSched = d.taskSched;
        localStorage.setItem("cal_tasksched", JSON.stringify(taskSched)); } }catch(_){}
    applyLocalDone();
  }catch(e){}
}
/* 保管用イベントを用意（無ければ作る）。一言 と ローカル済 を同じイベントに置く */
async function ensureSettingsEvent(){
  if(bannerEventId) return bannerEventId;
  const created = await api("/calendars/primary/events", { method:"POST", body: JSON.stringify({
    summary:"（カレンダーアプリのメモ／消さないでください）",
    start:{ date:"2000-01-01" }, end:{ date:"2000-01-02" },
    transparency:"transparent", visibility:"private",
    extendedProperties:{ private:{ calappBanner:"1" } }
  }) });
  if(created) bannerEventId = created.id;
  return bannerEventId;
}
/* 一言をGoogleへ（extendedProperties.private.banner） */
async function saveBannerRemote(text){
  if(!LIVE) return;                          // 未接続なら端末保存のみ
  try{ const id = await ensureSettingsEvent(); if(!id) return;
    await api("/calendars/primary/events/"+encodeURIComponent(id),
      { method:"PATCH", body: JSON.stringify({ extendedProperties:{ private:{ banner:text } } }) });
  }catch(e){}
}
/* ローカル済＋マトリクス配置を Google の設定用イベント(description)へ（端末にも即保存） */
let _descTimer = null;
function saveSettingsDesc(){
  try{
    localStorage.setItem("cal_localdone", JSON.stringify([...localDone]));
    localStorage.setItem("cal_matrixpos", JSON.stringify(matrixPos));
    localStorage.setItem("cal_tasksched", JSON.stringify(taskSched));
  }catch(e){}
  if(!LIVE) return;
  clearTimeout(_descTimer);
  _descTimer = setTimeout(async ()=>{
    try{ const id = await ensureSettingsEvent(); if(!id) return;
      await api("/calendars/primary/events/"+encodeURIComponent(id),
        { method:"PATCH", body: JSON.stringify({ description: JSON.stringify({ localDone:[...localDone], matrixPos, taskSched }) }) });
    }catch(e){}
  }, 700);
}
/* ローカル済のIDを、読み込んだ予定へ反映（済にして隠す） */
function applyLocalDone(){
  let changed = false;
  for(const e of events){ if(localDone.has(e.id) && !e.done){ e.done = true; changed = true; } }
  if(changed) renderView();
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  installManifest();
  initBanner();
  calendars = mockCalendars();
  events = mockEvents();
  setStatus(false);
  renderCals();
  pendingScrollNow = true;                // 起動時は現在時刻付近から始める
  renderView();
  autoReconnect();                        // 前回つないでいれば黙って再開を試みる
}
boot();
